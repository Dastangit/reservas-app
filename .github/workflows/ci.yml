name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: i18n keys in sync
        run: node frontend/scripts/check-i18n-keys.js
      - name: Backend URL matches in vercel.json and middleware.js
        run: node frontend/scripts/api-base.js
      - name: Site URL matches in every static file
        run: node frontend/scripts/site-url.js
      - name: Prerendered pages up to date
        run: node frontend/scripts/prerender.mjs --check
      - name: JS modules parse
        run: for f in frontend/js/*.js frontend/js/*/*.js; do node --input-type=module --check < "$f" || exit 1; done
